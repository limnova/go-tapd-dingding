name: CI/CD

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Test and vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

  container:
    name: Validate container build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Compose validation files
        run: |
          cp .env.example .env
          cp config.example.yaml config.yaml

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build application image
        run: docker build --tag tapd-dingding:ci .

  deploy:
    name: Deploy to server
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs:
      - test
      - container
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_PATH: /home/ubuntu/tapd-dingding
    steps:
      - name: Configure SSH
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Deploy Compose application
        env:
          REPOSITORY_URL: https://github.com/${{ github.repository }}.git
        run: |
          ssh -i "$HOME/.ssh/deploy_key" "$DEPLOY_USER@$DEPLOY_HOST" \
            "REPOSITORY_URL='$REPOSITORY_URL' DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -eu
          if [ ! -d "$DEPLOY_PATH/.git" ]; then
            mkdir -p "$DEPLOY_PATH"
            git clone --branch master --depth 1 "$REPOSITORY_URL" "$DEPLOY_PATH"
          else
            git -C "$DEPLOY_PATH" fetch --depth 1 origin master
            git -C "$DEPLOY_PATH" reset --hard origin/master
          fi
          cd "$DEPLOY_PATH"
          test -f .env
          test -f config.yaml || cp config.example.yaml config.yaml
          chmod 644 config.yaml
          docker compose up -d --build --remove-orphans
          docker compose ps
          curl --fail --silent --show-error http://127.0.0.1:8080/healthz
          REMOTE
